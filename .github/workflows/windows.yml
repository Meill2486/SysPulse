name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build and run self-test
        run: |
          dotnet build -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process -FilePath .\bin\Release\net10.0-windows\SysPulse.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content (Join-Path $env:TEMP 'SysPulse-selftest.log')
          exit $test.ExitCode
      - name: Verify and package release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          .\Scripts\Publish-Windows.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'SysPulse-release') -ReleaseTag $env:GITHUB_REF_NAME
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: SysPulse-win-x64
          path: |
            ${{ runner.temp }}/SysPulse-release/SysPulse-v*-win-x64.zip
            ${{ runner.temp }}/SysPulse-release/SHA256SUMS.txt
          if-no-files-found: error
